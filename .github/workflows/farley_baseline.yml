name: Seed Farley Baseline

# Runs after every push to main so that the next PR always has a real
# baseline cassette to compare against.
on:
  push:
    branches:
      - main
  workflow_dispatch: {}   # Allow manual trigger for the first seed

jobs:
  seed-baseline:
    permissions:
      contents: write      # Needed to commit the baseline cassette back to main
      pull-requests: read
    runs-on: ubuntu-latest
    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use a PAT or deploy key if branch protection rules block GITHUB_TOKEN pushes.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install build tools and project deps
        run: |
          python -m pip install -U pip setuptools wheel build hatchling
          python -m pip install -e .

      - name: Pull Qwen3.5 2B model
        run: |
          curl --fail -sS -X POST http://localhost:11434/api/pull \
            -H 'Content-Type: application/json' \
            -d '{"name":"qwen3.5:2b"}' || true

      - name: Run Farley evaluator against main tests
        run: |
          python3 scripts/farley_score_evaluator.py tests/ \
            --mode record \
            --cassette farley_score-main-latest.json \
            --run-id main-baseline \
            --model "ollama/qwen3.5:2b"

      - name: Commit updated baseline cassette to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/cassettes/farley_score-main-latest.json
          # Only commit if the cassette actually changed.
          if git diff --cached --quiet; then
            echo "Baseline cassette unchanged — nothing to commit."
          else
            git commit -m "chore: update Farley baseline cassette [skip ci]"
            git push
          fi

      - name: Upload baseline cassette as artifact (for audit)
        uses: actions/upload-artifact@v4
        with:
          name: farley-baseline-main
          path: artifacts/cassettes/farley_score-main-latest.json
