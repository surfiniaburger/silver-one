name: Farley Score CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

jobs:
  farley-eval:
    permissions:
      pull-requests: write
      contents: read
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.number }}
      PYTHONPATH: src
    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
        env:
          OLLAMA_NUM_PARALLEL: 1
          OLLAMA_KEEP_ALIVE: "24h"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set dynamic run clock
        run: echo "RUN_CLOCK_NOW=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.7.2"
          python-version: '3.11'
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --no-install-project --no-build --locked

      - name: Run targeted unit tests
        run: |
          uv run --no-sync --no-build --locked pytest tests scenarios/debate/test_pre_filter.py -q --disable-warnings --maxfail=1

      - name: Pull Qwen3.5 2B model
        run: |
          curl --fail -sS -X POST http://localhost:11434/api/pull -H 'Content-Type: application/json' -d '{"name":"qwen3.5:2b"}' || true

      - name: Run Farley evaluator
        run: |
          uv run --no-sync --no-build --locked python3 scripts/farley_score_evaluator.py \
            --base origin/main \
            --mode record \
            --cassette farley_score-PR-${{ env.PR_NUMBER }}.json \
            --run-id pr-${{ env.PR_NUMBER }} \
            --model "ollama/qwen3.5:2b"

      - name: Upload cassette
        uses: actions/upload-artifact@v4
        with:
          name: farley-cassette-pr-${{ env.PR_NUMBER }}
          path: |
            artifacts/cassettes/farley_score-PR-${{ env.PR_NUMBER }}.json
            artifacts/metrics/token_spend.jsonl

  code-review:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.number }}
      PYTHONPATH: src
    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
        env:
          OLLAMA_NUM_PARALLEL: 1
          OLLAMA_KEEP_ALIVE: "24h"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set dynamic run clock
        run: echo "RUN_CLOCK_NOW=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.7.2"
          python-version: '3.11'
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --no-install-project --no-build --locked

      - name: Pull Qwen3.5 2B model
        run: |
          curl --fail -sS -X POST http://localhost:11434/api/pull -H 'Content-Type: application/json' -d '{"name":"qwen3.5:2b"}' || true

      - name: Run code review evaluator
        run: |
          uv run --no-sync --no-build --locked python3 scripts/code_review_evaluator.py \
            --base origin/main \
            --mode record \
            --cassette code_review-PR-${{ env.PR_NUMBER }}.json \
            --run-id pr-cr-${{ env.PR_NUMBER }} \
            --model "ollama/qwen3.5:2b"

      - name: Upload cassette
        uses: actions/upload-artifact@v4
        with:
          name: code-review-cassette-pr-${{ env.PR_NUMBER }}
          path: |
            artifacts/cassettes/code_review-PR-${{ env.PR_NUMBER }}.json
            artifacts/metrics/token_spend.jsonl

  unified-report:
    needs: [farley-eval, code-review]
    permissions:
      pull-requests: write
      contents: read
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.number }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.7.2"
          python-version: '3.11'
          enable-cache: true

      - name: Download Farley cassette
        uses: actions/download-artifact@v4
        with:
          name: farley-cassette-pr-${{ env.PR_NUMBER }}
          path: artifacts

      - name: Download Code Review cassette
        uses: actions/download-artifact@v4
        with:
          name: code-review-cassette-pr-${{ env.PR_NUMBER }}
          path: artifacts

      - name: Sync dependencies
        run: uv sync --no-install-project --no-build --locked

      - name: Run API Compatibility Check
        run: |
          uv run --no-sync --no-build --locked python3 scripts/compatibility_check.py \
            --base origin/main \
            --out artifacts/metrics/compatibility_results.json

      - name: Compile Unified Quality Report
        continue-on-error: true
        run: |
          uv run --no-sync --no-build --locked python3 scripts/unified_compare.py \
            --code-review-pr artifacts/cassettes/code_review-PR-${{ env.PR_NUMBER }}.json \
            --farley-baseline artifacts/cassettes/farley_score-main-latest.json \
            --farley-pr artifacts/cassettes/farley_score-PR-${{ env.PR_NUMBER }}.json \
            --compatibility-results artifacts/metrics/compatibility_results.json \
            --out report.md

      - name: Ensure report.md exists
        if: always()
        run: touch report.md

      - name: Upload unified report
        uses: actions/upload-artifact@v4
        with:
          name: unified-quality-report-pr-${{ env.PR_NUMBER }}
          path: report.md

      - name: Post Unified report as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const marker = '<!-- unified-quality-report -->';
            let body;
            try {
              const raw = fs.readFileSync('report.md', 'utf8');
              const maxLen = 30000;
              const content = raw.length > maxLen
                ? raw.slice(0, maxLen) + '\n\n_Report truncated — download the full artifact for details._'
                : raw;
              body = `${marker}\n${content}`;
            } catch (e) {
              body = `${marker}\n⚠️ Unified quality report could not be read: ${e.message}`;
            }

            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });

              const existing = comments.find(c => c.body && c.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
                core.info(`Updated existing Unified comment #${existing.id}`);
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body,
                });
                core.info('Created new Unified comment');
              }
            } catch (e) {
              core.warning(`Failed to post/update PR comment: ${e.message}`);
            }


      - name: Gate PR status based on Unified Verdict
        run: |
          # Re-run unified_compare.py to enforce the actual gating exit code (0 = PASS, 2 = FAIL)
          uv run --no-sync --no-build --locked python3 scripts/unified_compare.py \
            --code-review-pr artifacts/cassettes/code_review-PR-${{ env.PR_NUMBER }}.json \
            --farley-baseline artifacts/cassettes/farley_score-main-latest.json \
            --farley-pr artifacts/cassettes/farley_score-PR-${{ env.PR_NUMBER }}.json \
            --compatibility-results artifacts/metrics/compatibility_results.json \
            --out report.md


