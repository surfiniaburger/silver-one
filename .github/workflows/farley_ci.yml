name: Farley Score CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

jobs:
  farley-eval:
    permissions:
      pull-requests: write
      contents: read
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.number }}
    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install build tools and project deps
        run: |
          python -m pip install -U pip setuptools wheel build hatchling
          python -m pip install -e .

      - name: Run targeted unit tests
        run: |
          python -m pytest tests -q --disable-warnings --maxfail=1

      - name: Pull Qwen3.5 2B model
        run: |
          curl --fail -sS -X POST http://localhost:11434/api/pull -H 'Content-Type: application/json' -d '{"name":"qwen3.5:2b"}' || true

      - name: Run Farley evaluator
        run: |
          python3 scripts/farley_score_evaluator.py . --mode record --cassette artifacts/cassettes/farley_score-PR-${{ env.PR_NUMBER }}.json --run-id pr-${{ env.PR_NUMBER }} --model "ollama/qwen3.5:2b"

      - name: Upload cassette
        uses: actions/upload-artifact@v4
        with:
          name: farley-cassette-pr-${{ env.PR_NUMBER }}
          path: artifacts/cassettes/farley_score-PR-${{ env.PR_NUMBER }}.json

      - name: Compare to baseline and generate report
        run: |
          python3 scripts/farley_compare.py \
            --baseline artifacts/cassettes/farley_score-main-latest.json \
            --pr artifacts/cassettes/farley_score-PR-${{ env.PR_NUMBER }}.json \
            --out report.md || true

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: farley-report-pr-${{ env.PR_NUMBER }}
          path: report.md

      - name: Post Farley report as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const marker = '<!-- farley-report -->';
            let body;
            try {
              const raw = fs.readFileSync('report.md', 'utf8');
              // GitHub PR comments are capped at ~65 536 chars; truncate gracefully.
              const maxLen = 60000;
              const content = raw.length > maxLen
                ? raw.slice(0, maxLen) + '\n\n_Report truncated — download the full artifact for details._'
                : raw;
              body = `${marker}\n${content}`;
            } catch (e) {
              body = `${marker}\n⚠️ Farley report could not be read: ${e.message}`;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated existing Farley comment #${existing.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
              core.info('Created new Farley comment');
            }
